# Fly.io deployment for the recode live browser server.
#
#   flyctl auth login
#   LB_TOKEN=<long-random> ./deploy.sh
#
# Then put https://recode-live-browser.fly.dev into
# Browser -> Live browser server in the workbench.
app = "recoder"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  LB_TRACE_DIR = "/data/traces"
  # Fly's edge sets x-forwarded-for / x-forwarded-proto on every request but
  # does NOT inject an Access-Control-Allow-Origin of its own (verified
  # against this deployment: /health and /api/sessions returned no ACAO at
  # all). Auto mode therefore concluded "a proxy handles CORS" and sent
  # nothing, so the browser blocked every call. Force it on.
  LB_CORS = "on"
  # Set a token to lock the server down:
  #   fly secrets set LB_TOKEN=your-long-random-string
  # and paste the same token into the workbench.

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  # Sessions live in this process's memory and a Chromium page cannot be
  # shared between machines, so this app must run on exactly ONE machine.
  # With two, Fly round-robins requests and a session created on one machine
  # is "no such session" on the other (measured: 4 hits / 6 misses on 10
  # consecutive GETs of the same id). deploy.sh enforces this with
  # `flyctl scale count 1`; do not raise it without moving sessions to
  # shared state first.

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 400

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[[mounts]]
  source = "lb_data"
  destination = "/data"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"
