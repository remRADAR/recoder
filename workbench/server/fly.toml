# Fly.io deployment for the recode live browser server.
#
#   flyctl auth login
#   LB_TOKEN=<long-random> ./deploy.sh
#
# Then put https://recode-live-browser.fly.dev into
# Browser -> Live browser server in the workbench.
app = "recoder"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  LB_TRACE_DIR = "/data/traces"
  # Set a token to lock the server down:
  #   fly secrets set LB_TOKEN=your-long-random-string
  # and paste the same token into the workbench.

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 400

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[[mounts]]
  source = "lb_data"
  destination = "/data"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"
