plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'space.manus.recoder'
version = '0.1.0'

expoModule {
  canBePublished false
}

android {
  namespace 'expo.modules.recoder.runtime'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

// expo-module-gradle-plugin supplies the SDK-57-compatible compileOnly
// :expo-modules-core dependency and Kotlin toolchain from the generated root project.
